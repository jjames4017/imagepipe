site_name: ImagePipe
site_description: A repeatable, never-delete photo ingest pipeline
repo_name: imagepipe
copyright: GPL-3.0-or-later
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Configuration: configuration.md
  - Design:
      - Architecture: architecture.md
      - Rules and decisions: design.md
      - Excluded reasons: excluded-reasons.md
      - Manifest database: manifest.md
  - Stages:
      - Catalogue: stages/catalogue.md
      - Triage: stages/triage.md
      - Layered TIFF / PSD: stages/layered.md
      - Phase 2 (stages 1, 2, 4): stages/phase2.md
  - Web UI: web-ui.md
  - Notifications: notifications.md
  - Development: development.md
  - Roadmap: roadmap.md
