[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imagepipe"
version = "0.5.3"
description = "A repeatable, never-delete photo ingest pipeline: catalogue, dedupe, classify, tag and hand off to PhotoPrism/Immich."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "Jonathan James" }]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "PyYAML>=6",
  "Pillow>=10",
  "tzdata",
]

[project.optional-dependencies]
heif = ["pillow-heif>=0.16"]
triage = ["reverse_geocoder>=1.5", "pypdf>=4"]
layered = ["psd-tools>=1.9", "tifffile>=2023.1", "imagecodecs>=2023.1"]
dev = ["pytest>=8", "mkdocs-material>=9"]

[project.scripts]
imagepipe = "imagepipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"imagepipe.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
