# ImagePipe configuration
#
# Every path here is a path INSIDE the container. Map host folders to these
# paths in your compose file. See docs/configuration.md for every key.

timezone: Australia/Brisbane

# The manifest database: one SQLite file recording every file ever seen.
# Keep it on fast storage that is snapshotted/backed up.
manifest: /data/manifest/imagepipe.db
log_dir: /data/logs
reports_dir: /data/reports

# Folders ImagePipe reads from. Mount them read-only.
sources:
  - name: photos                      # short name used on the command line
    path: /sources/photos             # where ImagePipe sees it (container path)
    host_path: /srv/photos            # how it appears in reports (host path) - optional
    exclude: []                       # glob patterns, matched against the relative path or name
                                      # e.g. ["@eaDir", "*/.Trash-*", "#recycle"]

catalogue:
  workers: 8                          # parallel readers; the disks are usually the limit
  hash: sha256                        # sha256 | none
  read_image_metadata: true           # dimensions, EXIF, camera, date
  use_exiftool: true                  # RAW and video details (exiftool is in the Docker image)
  list_archive_contents: false        # list what's inside .zip files
  batch_size: 500                     # files per database commit

notify:
  apprise_url: ""                     # base URL of your Apprise API server, e.g. http://apprise:8000
  apprise_key: ""                     # the Apprise config key that routes to your services (ntfy etc.)
  tags: ""                            # optional Apprise tag(s)
  on: [finished, error]               # which events send a notification
