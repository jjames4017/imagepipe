# ImagePipe configuration
#
# Every path here is a path INSIDE the container. Map host folders to these
# paths in your compose file. See docs/configuration.md for every key.

timezone: Australia/Brisbane

# The manifest database: one SQLite file recording every file ever seen.
# Keep it on fast storage that is snapshotted/backed up.
manifest: /data/manifest/imagepipe.db
log_dir: /data/logs
reports_dir: /data/reports

# Folders ImagePipe reads from. Mount them read-only.
sources:
  - name: photos                      # short name used on the command line
    path: /sources/photos             # where ImagePipe sees it (container path)
    host_path: /srv/photos            # how it appears in reports (host path) - optional
    exclude: []                       # glob patterns, matched against the relative path or name
                                      # e.g. ["@eaDir", "*/.Trash-*", "#recycle"]

catalogue:
  workers: 8                          # parallel readers; the disks are usually the limit
  hash: sha256                        # sha256 | none
  read_image_metadata: true           # dimensions, EXIF, camera, date
  use_exiftool: true                  # RAW and video details (exiftool is in the Docker image)
  list_archive_contents: true         # list what's inside .zip files (reads the index only, extracts nothing)
  batch_size: 500                     # files per database commit

notify:
  apprise_url: ""                     # base URL of your Apprise API server, e.g. http://apprise:8000
  apprise_key: ""                     # the Apprise config key that routes to your services (ntfy etc.)
  tags: ""                            # optional Apprise tag(s)
  events: [finished, error]           # which events send a notification

# Triage (optional): sort mixed folder trees before they enter the pipeline.
# Mount /wolf-pool/vault into the container at the SAME path (one mount), so
# these paths match the host and moves within it are instant hard-link moves.
# Triage also needs IMAGEPIPE_FILESTACK in the compose file (e.g.
# /wolf-pool/vault/filestack, inside that same mount): everything it sorts goes
# to <filestack>/sorted/<category>/. See docs/stages/triage.md.
triage:
  database: /mnt/appdata/photostage/imagepipe/triage/triage.db
  log_dir: /mnt/appdata/photostage/imagepipe/triage/logs
  reports_dir: /mnt/appdata/photostage/imagepipe/triage/reports
  sources:                                    # folders to sort (files are MOVED out of them)
    - name: photos
      path: /wolf-pool/vault/photos
    - name: file-cabinet
      path: "/wolf-pool/vault/file cabinet"
      exclude: []                             # glob patterns, e.g. ["@eaDir", ".zfs"]
  workers: 8                                  # parallel readers during scan
  verify: auto                                # auto: inode check for same-disk moves, SHA-256 for copies | hash: always SHA-256
  embed_metadata: []                          # off: files are not rewritten; the ID is in the name and the database.
                                              # ImagePipe stage 2 writes it into each photo. Can list image, pdf, video
  reverse_geocode: true                       # turn GPS into a place name for the smartname (offline)
  day_first: true                             # 03-04-2015 in a name means 3 April
  live_photo_max_bytes: 20MB                  # a video this size or smaller beside a same-named photo travels with it
  max_archive_depth: 5                        # archives inside archives, this deep
  max_extract_bytes: 200GB                    # an archive that unpacks to more than this goes to quarantine/archive-failed
  smartname_max_length: 80
  # categories:                               # leave out for the built-in list (images and raw -> imagepipe)
  #   documents: {pipeline: none, extensions: [pdf, docx, txt]}

# External tools (optional): where each outside tool is, so nothing is hard-coded.
# Edit in the web UI (Settings -> External tools), where each has a Test button.
# Passwords and keys are saved here in plain text; keep this file's folder private.
# tools:
#   scansplitter: {url: http://<host>:8010}
#   photoprism:   {url: http://<host>:2342, username: admin, password: ""}
#   immich:       {url: http://<host>:2283, api_key: ""}
#   a_eye:        {url: http://<host>:8000}
#   digikam:      {url: http://<host>:3011}
